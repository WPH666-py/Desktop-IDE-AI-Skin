[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepskins"
version = "0.9.0"
description = "DeepSeek 大肥鱼 & AI 全家桶 皮肤目录: 32 套壁纸一键克隆安装 + 壁纸切换 (pip install deepskins)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "WPH666-py" }]
keywords = ["wallpaper", "deepseek", "ai", "skin", "desktop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/WPH666-py/Desktop-IDE-AI-Skin"
Source = "https://github.com/WPH666-py/Desktop-IDE-AI-Skin"

[project.scripts]
deepskins = "deepskins.cli:main"

[tool.setuptools]
packages = ["deepskins"]

[tool.setuptools.package-data]
deepskins = ["catalog.json"]
